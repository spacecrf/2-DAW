<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="Página de contacto del portfolio profesional de Manuel García. Formulario accesible y responsive.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/custom.css">

    <!-- Favicon -->
    <link rel="icon" href="../media/favicon/favicon.ico">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">Manuel</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">Sobre mí</a></li>
                <li class="nav-item"><a class="nav-link" href="projects.html">Proyectos</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Servicios</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">Contacto</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= HEADER ================= -->
<header class="py-5 text-center">
    <div class="container py-5 text-center">
        <h1 class="display-6 fw-bold">Contacto</h1>
        <p class="lead mt-3 mx-auto text-center col-md-8 col-lg-6">
            Rellena el formulario y me pondré en contacto contigo lo antes posible.
        </p>
    </div>
</header>

<!-- ================= FORMULARIO ================= -->
<main class="container py-5">
    <section class="row justify-content-center">
        <div class="col-md-6">

            <form id="formContacto" novalidate aria-describedby="feedback">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea id="mensaje" rows="5" class="form-control" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Enviar mensaje
                </button>

                <p id="feedback" class="mt-3" aria-live="polite"></p>

            </form>

        </div>
    </section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-dark text-light py-4">
    <div class="container text-center">
        <p class="mb-1">&copy; 2026 Manuel García</p>
        <p class="mb-0">
            <a href="#" class="text-light me-2">LinkedIn</a>
            <a href="#" class="text-light me-2">GitHub</a>
        </p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/main.js"></script>

</body>
</html>
